name: Build ZAEMO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ZAEMO_KEYSTORE_PASSWORD }}
      KS_B64: ${{ secrets.ZAEMO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - name: Use new ZAEMO logo as app icon
        run: |
          B=$(base64 -w0 file_000000007e18821190797053b1df082d.png)
          printf '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254"><image width="1254" height="1254" href="data:image/png;base64,%s" xlink:href="data:image/png;base64,%s"/></svg>' "$B" "$B" > icon.svg
          ls -la icon.svg
      - run: node android-setup.mjs
      - name: Round adaptive icon (no white ring)
        run: |
          node <<'EOF'
          const fs = require("fs"); const sharp = require("sharp");
          const A = "android/app/src/main/res";
          const src = "file_000000007e18821190797053b1df082d.png";
          (async () => {
            const S = 432, L = Math.round(S * 0.74);
            const logo = await sharp(src).resize(L, L).png().toBuffer();
            const fg = await sharp({ create: { width: S, height: S, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } }).composite([{ input: logo, left: Math.round((S - L) / 2), top: Math.round((S - L) / 2) }]).png().toBuffer();
            fs.mkdirSync(A + "/mipmap-xxxhdpi", { recursive: true });
            fs.writeFileSync(A + "/mipmap-xxxhdpi/ic_launcher_foreground.png", fg);
            fs.mkdirSync(A + "/values", { recursive: true });
            fs.writeFileSync(A + "/values/zaemo_icon_bg.xml", '<?xml version="1.0" encoding="utf-8"?><resources><color name="zaemo_icon_bg">#050d0c</color></resources>');
            fs.mkdirSync(A + "/mipmap-anydpi-v26", { recursive: true });
            const x = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/zaemo_icon_bg"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>';
            fs.writeFileSync(A + "/mipmap-anydpi-v26/ic_launcher.xml", x);
            fs.writeFileSync(A + "/mipmap-anydpi-v26/ic_launcher_round.xml", x);
          })();
          EOF
      - name: Add save-to-Downloads bridge
        run: |
          node <<'EOF'
          const fs = require("fs");
          const p = "android/app/src/main/java/com/zaemo/chat/Native.java";
          let j = fs.readFileSync(p, "utf8");
          if (!j.includes("saveFile")) {
            const save = [
              "  @JavascriptInterface public boolean saveFile(String name, String mime, String text) {",
              "    try {",
              "      byte[] data = text.getBytes(java.nio.charset.StandardCharsets.UTF_8);",
              "      if (android.os.Build.VERSION.SDK_INT >= 29) {",
              "        android.content.ContentValues v = new android.content.ContentValues();",
              "        v.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);",
              "        v.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mime);",
              "        v.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS);",
              "        android.net.Uri u = c.getContentResolver().insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);",
              "        if (u == null) return false;",
              "        java.io.OutputStream o = c.getContentResolver().openOutputStream(u);",
              "        o.write(data); o.close();",
              "        return true;",
              "      }",
              "      java.io.File d = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS);",
              "      d.mkdirs();",
              "      java.io.FileOutputStream o = new java.io.FileOutputStream(new java.io.File(d, name));",
              "      o.write(data); o.close();",
              "      return true;",
              "    } catch (Exception e) { return false; }",
              "  }",
              ""
            ].join("\n");
            const i = j.lastIndexOf("}");
            j = j.slice(0, i) + save + "}\n";
            fs.writeFileSync(p, j);
            const mp = "android/app/src/main/AndroidManifest.xml";
            let m = fs.readFileSync(mp, "utf8");
            if (!m.includes("WRITE_EXTERNAL_STORAGE")) m = m.replace("</manifest>", '  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>');
            fs.writeFileSync(mp, m);
          }
          EOF
          grep -c saveFile android/app/src/main/java/com/zaemo/chat/Native.java
      - run: npx cap sync android
      - name: Set up permanent release signing
        run: |
          echo "$KS_B64" | base64 -d > android/app/zaemo-release.keystore
          node <<'EOF'
          const fs = require("fs");
          const p = "android/app/build.gradle";
          let b = fs.readFileSync(p, "utf8");
          b = b.replace(/versionCode \d+/, "versionCode 7").replace(/versionName "[^"]*"/, 'versionName "1.2.4"');
          if (!b.includes("signingConfigs.release")) {
            b = b.replace("buildTypes {", "signingConfigs {\n    release {\n      storeFile file('zaemo-release.keystore')\n      storePassword System.getenv('KS_PASS')\n      keyAlias 'zaemo'\n      keyPassword System.getenv('KS_PASS')\n    }\n  }\n  buildTypes {");
            b = b.replace("minifyEnabled false", "minifyEnabled false\n      signingConfig signingConfigs.release");
          }
          fs.writeFileSync(p, b);
          EOF
          grep -n "signingConfig\|versionCode\|versionName" android/app/build.gradle
      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          cp android/app/build/outputs/apk/release/app-release.apk ZAEMO.apk
          $APKSIGNER verify --print-certs ZAEMO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAEMO-apk
          path: ZAEMO.apk
      - name: Publish release v1.2.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4
          name: ZAEMO 1.2.4
          body: ZAEMO Android app (signed). Backup files now save to your Downloads folder. Download ZAEMO.apk and open it on your phone. Installs over the previous 1.2.x version.
          files: ZAEMO.apk
          make_latest: true
