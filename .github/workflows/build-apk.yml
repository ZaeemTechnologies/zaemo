name: Build ZAEMO APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ZAEMO_KEYSTORE_PASSWORD }}
      KS_B64: ${{ secrets.ZAEMO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - run: node android-setup.mjs
      - run: npx cap sync android
      - name: Set up permanent release signing
        run: |
          echo "$KS_B64" | base64 -d > android/app/zaemo-release.keystore
          node <<'EOF'
          const fs = require("fs");
          const p = "android/app/build.gradle";
          let b = fs.readFileSync(p, "utf8");
          b = b.replace(/versionCode \d+/, "versionCode 3").replace(/versionName "[^"]*"/, 'versionName "1.2.0"');
          if (!b.includes("signingConfigs.release")) {
            b = b.replace("buildTypes {", "signingConfigs {\n        release {\n            storeFile file('zaemo-release.keystore')\n            storePassword System.getenv('KS_PASS')\n            keyAlias 'zaemo'\n            keyPassword System.getenv('KS_PASS')\n        }\n    }\n    buildTypes {");
            b = b.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release");
          }
          fs.writeFileSync(p, b);
          EOF
          grep -n "signingConfig\|versionCode\|versionName" android/app/build.gradle
      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          cp android/app/build/outputs/apk/release/app-release.apk ZAEMO.apk
          $APKSIGNER verify --print-certs ZAEMO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAEMO-apk
          path: ZAEMO.apk
      - name: Publish release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: ZAEMO 1.2.0
          body: ZAEMO Android app (signed). Download ZAEMO.apk and open it on your phone (allow installing from this source). If an older ZAEMO is installed, uninstall it once first; later updates will install over this one.
          files: ZAEMO.apk
          make_latest: true
